# General Params
verbosity: 3
use_threadsafe_submap_collection: true
use_transform_caching: false
transform_lookup_time: 0.1
global_frame_name: &global_frame_name map
visualization_interval: -1.0
data_logging_interval: -1.0
print_timing_interval: 0.0
max_input_queue_length: 1000
ros_spinning_threads: 8
depth_type: 16U
color_msg_type: rgb8
use_image_data_manager: false

labels:
  type: csv
  file_name: /home/xiangweizeng/3D_slam/sematic-mapping/panoptic_mapping_ws/src/panoptic_mapping/panoptic_mapping_ros/config/classes/realsense_labels.csv

camera:
  verbosity: 1
  width: 640  # Px
  height: 480
  vx: 321.428
  vy: 245.055
  fx: 609.379
  fy: 609.931
  max_range: 5.0  # m
  min_range: 0.5

id_tracker:
  type: single_tsdf
  verbosity: 1
  # Submap
  frame_id: *global_frame_name

  # Single TSDF
  voxel_size: 0.05
  truncation_distance: -2
  voxels_per_side: 16
  use_class_layer: false
  use_detectron: false
  use_instance_classification: false
  # classification:
  #   type: fixed_count

tsdf_integrator:  
  type: single_tsdf
  verbosity: 1     

  # Projective
  use_weight_dropoff: true
  max_weight: 10000
  interpolation_method: adaptive  # nearest, bilinear, adaptive
  integration_threads: 8
  use_segmentation: false
  
visualization:  
  submaps:
    type: single_tsdf  
    verbosity: 1
    color_mode: color # color, normals, classes, instances, classification
    visualization_mode: all  # all
    submap_color_discretization: 20
    visualize_mesh: true
    visualize_tsdf_blocks: true
    visualize_free_space: true
    visualize_bounding_volumes: true
    include_free_space: true
    mesh_min_weight: 0.000001
  
  planning:
    verbosity: 1
    visualize_slice: true
    slice_resolution: 0.1
    slice_height: -0.5
  
  tracking:
    verbosity: 1
    visualize_tracking: true
